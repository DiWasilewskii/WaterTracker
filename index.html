<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аква-Тамагочі Про</title>
    <!-- Підключення стилів з папки css -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="game-container">
        
        <!-- Верхня панель з кнопкою виклику налаштувань -->
        <div class="top-bar">
            <button id="btn-open-settings" class="btn-icon">⚙️ Налаштування</button>
            
            <!-- Віджет погоди -->
            <div class="weather-widget">
                <span id="weather-city">...</span>: <span id="weather-temp">--</span>°C
            </div>
        </div>

        <!-- Екран Тамагочі -->
        <div class="pet-screen">
            <img id="pet-avatar" class="pet alive" src="img/regular_water.svg" alt="Тамагочі">
            <div id="pet-status" class="status-text">Завантаження...</div>
            <div id="countdown-timer" class="countdown-timer">00:00:00</div>
        </div>

        <!-- Показники -->
        <div class="stats-container">
            <div class="stat-box full-width">
                <span class="stat-label">Гідратація:</span>
                <span id="water-count" class="stat-value">0</span> / <span id="water-goal">2000</span> мл
            </div>
            <div class="stat-box">
                <span class="stat-label">Загалом випито:</span>
                <span id="total-volume" class="stat-value">0</span> мл
            </div>
            <div class="stat-box">
                <span class="stat-label">Прожито днів:</span>
                <span id="days-count" class="stat-value">0</span>
            </div>
        </div>

        <!-- Прогрес-бар -->
        <div class="progress-bar-container">
            <div id="progress-fill" class="progress-fill"></div>
        </div>

        <!-- Зона керування -->
        <div class="controls-bar">
            <div class="selection-row">
                <select id="select-drink" class="input-control">
                    <option value="water">💧 Чиста вода (100%)</option>
                    <option value="tea">🍵 Зелений чай (90%)</option>
                    <option value="coffee">☕ Кава (50%)</option>
                    <option value="soda">🥤 Газировка (40%)</option>
                </select>
                
                <input type="number" id="input-custom-volume" class="input-control text-input" value="250" min="10" max="2000" placeholder="мл">
            </div>
            <button id="btn-drink" class="btn btn-main">🥛 Прийняти напій</button>
            <button id="btn-restart" class="btn btn-danger hidden">🥚 Новий улюбленець</button>
        </div>

        <div class="dev-panel">
            <button id="btn-simulate-day" class="btn-dev">Симулювати наступний день</button>
        </div>
    </div>

    <!-- Модальне вікно налаштувань (Popup) -->
    <!-- Оновлене модальне вікно налаштувань у index.html -->
<div id="settings-modal" class="modal hidden">
    <div class="modal-content">
        <span id="btn-close-settings" class="close-modal">&times;</span>
        <h3>⚙️ Профіль та Погода</h3>
        
        <div class="settings-grid">
            <label>Вага (кг): <input type="number" id="input-weight" value="60"></label>
            <label>Зріст (см): <input type="number" id="input-height" value="170"></label>
            <label>Вік: <input type="number" id="input-age" value="25"></label>
            <label>Стать: 
                <select id="input-gender">
                    <option value="male">Чоловік</option>
                    <option value="female">Жінка</option>
                </select>
            </label>
        </div>

        <!-- НОВА СЕКЦІЯ: Налаштування інтервалу пиття -->
        <h4 style="margin: 15px 0 5px 0; color: #4da6ff;">⏱️ Інтервал нагадувань</h4>
        <div class="settings-grid" style="margin-top: 5px;">
            <label>Обрати готовий:
                <select id="interval-select">
                    <option value="10">10 секунд (тест)</option>
                    <option value="900">15 хвилин</option>
                    <option value="1800">30 хвилин</option>
                    <option value="2700">45 хвилин</option>
                    <option value="3600" selected>1 годину</option>
                    <option value="5400">1.5 години</option>
                    <option value="7200">2 години</option>
                    <option value="10800">3 години</option>
                    <option value="custom">Свій варіант...</option>
                </select>
            </label>
            
            <label id="custom-interval-wrapper" class="hidden">Власні хвилини:
                <input type="number" id="input-custom-minutes" value="60" min="1" max="1440">
            </label>
        </div>

        <div class="weather-setting">
            <label>Місто: <input type="text" id="input-city" value="Київ"></label>
            <button id="btn-update-profile" class="btn-sub">Зберегти та оновити</button>
        </div>
        <p id="weather-status" class="weather-status-text">Очікування дії...</p>
    </div>
</div>

    <!-- Підключення скриптів з папки js (weather.js має бути першим) -->
    <script src="js/weather.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
